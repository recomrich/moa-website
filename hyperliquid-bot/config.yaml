bot:
  mode: "paper"  # "paper" (simulation) or "live" (real trading)
  update_interval: 5  # seconds entre chaque cycle

risk:
  max_risk_per_trade_pct: 1.5     # risquer 1.5% par trade
  max_drawdown_pct: 15.0          # drawdown max avant arret
  max_open_positions: 15          # plus de positions simultanees
  max_positions_per_symbol: 3     # 3 positions max par crypto (long+short+cycle)
  cooldown_minutes: 10            # 10 min entre trades sur meme symbole
  max_leverage: 20
  min_reward_risk_ratio: 1.3      # abaisse a 1.3 pour accepter plus de trades

trading_pairs:
  spot:
    - symbol: "BTC"
      strategies: ["trend_following", "momentum", "breakout", "cycle_trader"]
    - symbol: "ETH"
      strategies: ["trend_following", "momentum", "cycle_trader"]
    - symbol: "SOL"
      strategies: ["momentum", "breakout", "cycle_trader"]
    - symbol: "XRP"
      strategies: ["trend_following", "momentum", "cycle_trader"]
  perps:
    - symbol: "BTC"
      leverage: 5
      strategies: ["trend_following", "momentum", "breakout", "cycle_trader", "scalping"]
    - symbol: "ETH"
      leverage: 5
      strategies: ["trend_following", "momentum", "breakout", "cycle_trader"]
    - symbol: "SOL"
      leverage: 5
      strategies: ["momentum", "breakout", "cycle_trader"]
    - symbol: "XRP"
      leverage: 5
      strategies: ["trend_following", "momentum", "breakout", "cycle_trader"]
    - symbol: "IO"
      leverage: 5
      strategies: ["momentum", "cycle_trader", "mean_reversion"]
    - symbol: "kPEPE"
      leverage: 3
      strategies: ["momentum", "cycle_trader", "breakout"]
    - symbol: "HYPE"
      leverage: 3
      strategies: ["momentum", "cycle_trader", "breakout"]
    - symbol: "WIF"
      leverage: 3
      strategies: ["momentum", "cycle_trader", "breakout"]
    - symbol: "DOGE"
      leverage: 3
      strategies: ["momentum", "cycle_trader", "mean_reversion"]
    - symbol: "AVAX"
      leverage: 3
      strategies: ["momentum", "cycle_trader", "trend_following"]
    - symbol: "SUI"
      leverage: 3
      strategies: ["momentum", "cycle_trader", "breakout"]
    - symbol: "LINK"
      leverage: 3
      strategies: ["momentum", "cycle_trader", "trend_following"]

strategies:
  trend_following:
    enabled: true
    timeframe: "15m"
    ema_periods: [20, 50, 200]
  mean_reversion:
    enabled: true
    timeframe: "15m"
    rsi_oversold: 35
    rsi_overbought: 65
    bb_period: 20
    bb_std: 2.0
  breakout:
    enabled: true
    timeframe: "15m"
    volume_multiplier: 1.2
    lookback_period: 12
  scalping:
    enabled: true
    timeframe: "5m"
    ema_fast: 5
    ema_slow: 13
    tp_pct: 0.5
    sl_pct: 0.3
  grid_trading:
    enabled: true
    timeframe: "15m"
    grid_levels: 5
    bb_period: 20
    bb_std: 2.0
  swing_range:
    enabled: true
    timeframe: "15m"
    lookback_days: 30
    entry_zone_pct: 25
    min_daily_range_pct: 1.5
  momentum:
    enabled: true
    timeframe: "15m"
    ema_fast: 9
    ema_slow: 21
    momentum_pct: 1.5
    lookback_candles: 4
    rsi_min_buy: 48
    rsi_max_buy: 72
    rsi_min_sell: 28
    rsi_max_sell: 52
  cycle_trader:
    enabled: true
    timeframe: "15m"
    lookback_days: 30            # analyse 30 jours de fluctuations
    buy_zone_pct: 30             # achete LONG quand prix dans les 30% bas du range
    sell_zone_pct: 30            # ouvre SHORT quand prix dans les 30% haut du range
    min_range_pct: 8.0           # ignore les cryptos avec moins de 8% de range sur 30j
    rsi_buy_max: 50              # RSI < 50 pour acheter (pas deja suracheté)
    rsi_sell_min: 50             # RSI > 50 pour shorter (pas deja survendu)

dashboard:
  enabled: true
  host: "0.0.0.0"
  port: 8080

notifications:
  telegram:
    enabled: false
