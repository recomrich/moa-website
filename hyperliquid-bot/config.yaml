bot:
  mode: "paper"          # "paper" (simulation) ou "live" (réel)
  update_interval: 60    # secondes entre chaque analyse
  name: "HyperBot"

risk:
  max_risk_per_trade_pct: 1.0    # % du capital risqué par trade
  max_drawdown_pct: 10.0         # drawdown max avant arrêt du bot
  max_open_positions: 5          # nombre max de positions simultanées
  min_risk_reward_ratio: 2.0     # ratio risk/reward minimum
  default_leverage: 1            # levier par défaut

trading_pairs:
  spot:
    - symbol: "BTC"
      strategies: ["trend_following", "breakout"]
    - symbol: "ETH"
      strategies: ["mean_reversion"]
  perps:
    - symbol: "BTC"
      leverage: 5
      strategies: ["trend_following", "scalping"]
    - symbol: "SOL"
      leverage: 3
      strategies: ["breakout", "mean_reversion"]
    - symbol: "ETH"
      leverage: 3
      strategies: ["trend_following"]

strategies:
  trend_following:
    enabled: true
    timeframe: "1h"
    ema_fast: 20
    ema_mid: 50
    ema_slow: 200
    macd_fast: 12
    macd_slow: 26
    macd_signal: 9
    atr_multiplier_sl: 2.0
    atr_multiplier_tp: 4.0

  mean_reversion:
    enabled: true
    timeframe: "15m"
    rsi_period: 14
    rsi_oversold: 30
    rsi_overbought: 70
    bb_period: 20
    bb_std: 2.0
    atr_multiplier_sl: 1.5
    atr_multiplier_tp: 3.0

  breakout:
    enabled: true
    timeframe: "1h"
    lookback_periods: 20        # périodes pour détection résistance/support
    volume_multiplier: 1.5      # volume min = moyenne * ce multiplicateur
    atr_period: 14
    atr_multiplier_sl: 1.5
    atr_multiplier_tp: 3.0

  scalping:
    enabled: false
    timeframe: "5m"
    ema_fast: 5
    ema_slow: 13
    rsi_period: 14
    rsi_min: 45
    rsi_max: 65
    tp_pct: 0.8               # take profit en %
    sl_pct: 0.3               # stop loss en %

paper_trading:
  initial_capital: 10000.0    # capital virtuel en USD
  simulate_slippage: true
  slippage_pct: 0.05          # 0.05% de slippage simulé
  simulate_fees: true
  fee_pct: 0.04               # 0.04% de frais de maker/taker

dashboard:
  update_interval_ms: 1000    # intervalle de mise à jour WebSocket en ms
  max_trades_history: 100     # nombre de trades affichés dans l'historique
  chart_candles: 200          # nombre de bougies affichées sur le graphique

notifications:
  telegram:
    enabled: false
    on_trade_open: true
    on_trade_close: true
    on_error: true
    on_drawdown_alert: true

logging:
  level: "INFO"
  rotation: "10 MB"
  retention: "7 days"
